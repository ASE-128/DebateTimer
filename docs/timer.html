<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="DebateTimer">
  <title>辩论赛计时器</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/timer.css">

  <style>
    body.embed-mode .control-panel,
    body.embed-mode .design-by { display: none !important; }
    body.embed-mode .watermark { padding-bottom: 24px; }
  </style>
</head>
<body>
  <main class="timer-shell">
      <div class="bg-layer"></div>
      <header class="top-band">
        <div class="team affirmative">
          <span class="team-label" id="affirmativeLabel">正方</span>
          <img id="affirmativeLogo" class="team-logo" src="" alt="" />
          <strong class="team-name" id="affirmativeTeamName">正方队</strong>
          <span class="team-topic" id="affirmativeTopic">正方辩题</span>
        </div>
        <div class="team negative">
          <span class="team-label" id="negativeLabel">反方</span>
          <img id="negativeLogo" class="team-logo" src="" alt="" />
          <strong class="team-name" id="negativeTeamName">反方队</strong>
          <span class="team-topic" id="negativeTopic">反方辩题</span>
        </div>
      </header>

      <section class="main-area">
        <div class="event-name" id="eventName">赛事名称</div>
        <div class="segment-name" id="segmentName">开场</div>
        <div class="timer-display" id="timerDisplay">
          <div class="single-timer" id="singleTimer">00:00</div>
          <div class="dual-timer" id="dualTimer">
            <div class="dual-side affirmative">
              <span class="dual-label">正方</span>
              <span class="dual-time" id="affirmativeTime">00:00</span>
            </div>
            <div class="dual-side negative">
              <span class="dual-label">反方</span>
              <span class="dual-time" id="negativeTime">00:00</span>
            </div>
          </div>
          <div class="timer-progress" id="timerProgress">
            <div class="timer-progress-bar" id="timerProgressBar" style="width: 100%;"></div>
          </div>
        </div>
        <div class="side-label" id="sideLabel">当前发言方</div>
      </section>

      <aside class="control-panel">
        <div class="control-group">
          <button id="startBtn">
            <span class="btn-label">启动</span>
            <span class="btn-key">Space</span>
          </button>
        </div>
        <div class="control-group duel-side-group" id="duelSideGroup" style="display:none;">
          <button id="duelSideAffirmativeBtn" type="button">
            <span class="btn-label">正方</span>
            <span class="btn-key">,</span>
          </button>
          <button id="duelSideNegativeBtn" type="button">
            <span class="btn-label">反方</span>
            <span class="btn-key">.</span>
          </button>
        </div>
        <div class="control-group">
          <button id="stopBtn">
            <span class="btn-label">停止</span>
          </button>
          <button id="resetBtn">
            <span class="btn-label">重置</span>
          </button>
        </div>
        <div class="control-group">
          <button id="prevBtn">
            <span class="btn-label">◀</span>
          </button>
          <button id="nextBtn">
            <span class="btn-label">▶</span>
          </button>
        </div>
        <div class="control-group">
          <button id="jumpBtn">
            <span class="btn-label">跳转</span>
          </button>
          <button id="setTimeBtn">
            <span class="btn-label">设时</span>
          </button>
        </div>
        <div class="control-group">
          <button id="test30Btn">
            <span class="btn-label">30s</span>
            <span class="btn-key">Q</span>
          </button>
          <button id="test5Btn">
            <span class="btn-label">5s</span>
            <span class="btn-key">W</span>
          </button>
          <button id="testEndBtn">
            <span class="btn-label">结束</span>
            <span class="btn-key">E</span>
          </button>
        </div>
        <div class="control-group">
          <button id="fullscreenBtn">
            <span class="btn-label">全屏</span>
            <span class="btn-key">F</span>
          </button>
          <button id="backBtn">
            <span class="btn-label">返回</span>
            <span class="btn-key">B</span>
          </button>
        </div>
      </aside>

      <footer class="judge-bar" id="judgeBar" style="display: none;"></footer>
      <footer class="watermark" id="watermark">辩论计时器</footer>
      <div class="design-by" id="designBy">© Chen Yu 2026<br> All rights reserved.</div>
    </main>
    <div id="jumpModal" class="timer-modal">
      <div class="box">
        <h2>环节跳转</h2>
        <div id="jumpSegmentList" class="segment-list"></div>
        <button id="jumpCancelBtn" class="secondary">取消</button>
      </div>
    </div>
    <div id="setTimeModal" class="timer-modal">
      <div class="box">
        <h2>设置时间</h2>
        <div class="time-inputs">
          <label>分<input id="setTimeMin" type="number" min="0" value="0" /></label>
          <label>秒<input id="setTimeSec" type="number" min="0" max="59" value="0" /></label>
        </div>
        <button id="setTimeConfirmBtn">确认</button>
        <button id="setTimeCancelBtn" class="secondary">取消</button>
      </div>
    </div>
  <div id="standaloneSetup" class="standalone-setup">
      <div class="box">
        <h2>赛前设置</h2>
        <div id="ssScheduleSection" class="ss-schedule-section" style="display:none;">
          <h3>选择预设赛程</h3>
          <div id="ssScheduleList" class="ss-schedule-list"></div>
          <p class="ss-schedule-or">或手动输入下方信息</p>
        </div>
        <label>正方队伍<input id="ssAffirmativeTeam" type="text" value="正方"></label>
        <label>正方辩题<input id="ssAffirmativeTopic" type="text" value="正方辩题"></label>
        <label>反方队伍<input id="ssNegativeTeam" type="text" value="反方"></label>
        <label>反方辩题<input id="ssNegativeTopic" type="text" value="反方辩题"></label>
        <div class="ss-judge-group">
          <label>评委一<input id="ssJudge1" type="text"></label>
          <label>评委二<input id="ssJudge2" type="text"></label>
          <label>评委三<input id="ssJudge3" type="text"></label>
        </div>
        <button id="ssStartBtn">开始计时</button>
      </div>
    </div>
